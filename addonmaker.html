<!DOCTYPE html>
<html>
<head>
  <title>MCPE Texture Editor</title>
  <style>
    body { background: #111; color: white; text-align: center; }
    canvas { border: 2px solid white; image-rendering: pixelated; cursor: crosshair; }
    #tools { margin: 15px; }
  </style>
</head>
<body>
  <h1>Minecraft Bedrock Texture Editor</h1>
  <div id="tools">
    <input type="file" accept="image/png" onchange="loadTexture(event)">
    <br><br>
    <input type="color" id="colorPicker" value="#00ff00">
    <input type="number" id="brushSize" value="1" min="1" max="16">
    <button onclick="saveTexture()">Save Texture</button>
  </div>
  <canvas id="canvas" width="128" height="128"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let drawing = false;

    function loadTexture(event) {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, 128, 128);
      };
      img.src = URL.createObjectURL(event.target.files[0]);
    }

    canvas.addEventListener("mousedown", () => drawing = true);
    canvas.addEventListener("mouseup", () => drawing = false);
    canvas.addEventListener("mousemove", draw);

    function draw(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / (rect.width / canvas.width));
      const y = Math.floor((e.clientY - rect.top) / (rect.height / canvas.height));
      const brushSize = parseInt(document.getElementById("brushSize").value);
      ctx.fillStyle = document.getElementById("colorPicker").value;
      ctx.fillRect(x, y, brushSize, brushSize);
    }

    function saveTexture() {
      const link = document.createElement("a");
      link.download = "texture.png";
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
  </html>
